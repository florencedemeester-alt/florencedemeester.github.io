<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tekentaal van de straat — Editie 04</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}canvas{display:block;width:100%;height:100%;touch-action:none;cursor:none}header{position:fixed;top:22px;left:24px;pointer-events:none}h1{font:700 16px/1.1 Arial,Helvetica,sans-serif;letter-spacing:-.025em;margin:0;color:#111}.cursor{position:fixed;pointer-events:none;display:none;left:0;top:0}.cursor svg{width:29px;height:42px}@media(max-width:600px){header{top:18px;left:18px}h1{font-size:14px}}@media(pointer:coarse){.cursor{display:none!important}}</style></head><body><canvas aria-label="Spuit op het bord. Sleep het ronde draaipunt of de rand om de voorkant, achterkant en zijkant te zien. Op je gsm draai je met twee vingers."></canvas><header><h1>TEKENTAAL<br>VAN DE STRAAT</h1></header><div class="cursor" aria-hidden="true"><svg viewBox="0 0 32 46"><path d="M10 13L5 39L24 34L27 10Z" fill="#ff4d00"/><path d="M16 10L18 3L25 3" fill="none" stroke="#111" stroke-width="2.8" stroke-linecap="square"/></svg></div><script>
const canvas=document.querySelector('canvas'),gl=canvas.getContext('webgl',{antialias:true,alpha:false}),cursor=document.querySelector('.cursor');
let w=innerWidth,h=innerHeight,dpr=1,rx=-.14,ry=.36,cx=w/2,cy=h/2+10,R=250,mode=null,active=null,last=null,point=null,drag=null,gesture=null,tickTime=0;
const pointers=new Map(),D=.13,N=128,surfaces=[];
function texture(kind){const c=document.createElement('canvas');c.width=1024;c.height=kind===2?256:1024;const p=c.getContext('2d');const gradient=p.createLinearGradient(0,0,c.width,c.height);gradient.addColorStop(0,kind===2?'#888087':kind===1?'#d1c0c8':'#f1dce7');gradient.addColorStop(1,kind===2?'#625d62':kind===1?'#e4d0dc':'#dfc4d3');p.fillStyle=gradient;p.fillRect(0,0,c.width,c.height);const t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);return {c,p,t,dirty:true,vertices:[]}}
if(!gl)throw new Error('Deze browser ondersteunt geen WebGL.');
for(let i=0;i<3;i++)surfaces.push(texture(i));
function vertex(surface,x,y,z,u,v,nx,ny,nz){surface.vertices.push(x,y,z,u,v,nx,ny,nz)}
for(let i=0;i<N;i++){const a=i/N*2*Math.PI,b=(i+1)/N*2*Math.PI;for(let k=0;k<2;k++){const z=k===0?D/2:-D/2,n=k===0?1:-1,s=surfaces[k];vertex(s,0,0,z,.5,.5,0,0,n);for(const t of [a,b])vertex(s,Math.cos(t),Math.sin(t),z,(Math.cos(t)+1)/2,(1-Math.sin(t))/2,0,0,n)}const s=surfaces[2],pts=[[a,-D/2,i/N,1],[b,-D/2,(i+1)/N,1],[a,D/2,i/N,0],[a,D/2,i/N,0],[b,-D/2,(i+1)/N,1],[b,D/2,(i+1)/N,0]];for(const [t,z,u,v] of pts)vertex(s,Math.cos(t),Math.sin(t),z,u,v,Math.cos(t),Math.sin(t),0)}
const vs=`attribute vec3 pos;attribute vec2 uv;attribute vec3 normal;uniform mat3 rot;uniform vec2 viewport;uniform vec2 center;uniform float radius;varying vec2 texcoord;varying float lighting;void main(){vec3 p=rot*pos;vec2 screen=center+vec2(p.x,-p.y)*radius;gl_Position=vec4(screen.x/viewport.x*2.0-1.0,1.0-screen.y/viewport.y*2.0,-p.z*.1,1.0);texcoord=uv;vec3 n=normalize(rot*normal);lighting=.77+.23*abs(dot(n,normalize(vec3(-.4,.6,1.))));}`;
const fs=`precision mediump float;uniform sampler2D image;varying vec2 texcoord;varying float lighting;void main(){vec4 c=texture2D(image,texcoord);float neon=step(.9,c.r)*step(c.g,.5)*step(c.b,.12);gl_FragColor=vec4(mix(c.rgb*lighting,c.rgb,neon),1.);}`;
function shader(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s));return s}const program=gl.createProgram();gl.attachShader(program,shader(gl.VERTEX_SHADER,vs));gl.attachShader(program,shader(gl.FRAGMENT_SHADER,fs));gl.linkProgram(program);gl.useProgram(program);const attrs=['pos','uv','normal'].map(n=>gl.getAttribLocation(program,n));const uniforms=Object.fromEntries(['rot','viewport','center','radius','image'].map(n=>[n,gl.getUniformLocation(program,n)]));
surfaces.forEach(s=>{s.buffer=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,s.buffer);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(s.vertices),gl.STATIC_DRAW);s.count=s.vertices.length/8});
function rotate(v){const a=Math.cos(rx),b=Math.sin(rx),c=Math.cos(ry),d=Math.sin(ry);let y=a*v[1]-b*v[2],z=b*v[1]+a*v[2];return [c*v[0]+d*z,y,-d*v[0]+c*z]}
function inverse(v){const a=Math.cos(rx),b=Math.sin(rx),c=Math.cos(ry),d=Math.sin(ry),x=c*v[0]-d*v[2],z=d*v[0]+c*v[2];return [x,a*v[1]+b*z,-b*v[1]+a*z]}
function matrix(){return new Float32Array([...rotate([1,0,0]),...rotate([0,1,0]),...rotate([0,0,1])])}
function handle(){const v=rotate([.85,.7,D/2]);return {x:cx+v[0]*R,y:cy-v[1]*R}}
function render(){gl.viewport(0,0,canvas.width,canvas.height);gl.clearColor(1,1,1,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);gl.enable(gl.DEPTH_TEST);gl.uniformMatrix3fv(uniforms.rot,false,matrix());gl.uniform2f(uniforms.viewport,w,h);gl.uniform2f(uniforms.center,cx,cy);gl.uniform1f(uniforms.radius,R);gl.uniform1i(uniforms.image,0);surfaces.forEach(s=>{gl.bindBuffer(gl.ARRAY_BUFFER,s.buffer);attrs.forEach((a,i)=>{gl.enableVertexAttribArray(a);gl.vertexAttribPointer(a,[3,2,3][i],gl.FLOAT,false,32,[0,12,20][i])});gl.bindTexture(gl.TEXTURE_2D,s.t);if(s.dirty){gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,s.c);s.dirty=false}gl.drawArrays(gl.TRIANGLES,0,s.count)});const p=handle();knob.style.left=p.x+'px';knob.style.top=p.y+'px'}
const knob=document.createElement('div');knob.style.cssText='position:fixed;width:17px;height:17px;background:white;border:1px solid #111;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;box-shadow:inset 0 0 0 5px white;background:#111';knob.setAttribute('aria-hidden','true');document.body.append(knob);
function resize(){const ow=w,oh=h;w=innerWidth;h=innerHeight;cx*=w/ow;cy*=h/oh;R=Math.max(50,Math.min(w*.36,(h-105)*.45));dpr=Math.min(devicePixelRatio||1,2);canvas.width=w*dpr;canvas.height=h*dpr;render()}resize();addEventListener('resize',resize);
function hit(x,y){const o=inverse([(x-cx)/R,(cy-y)/R,10]),d=inverse([0,0,-1]),hits=[];if(Math.abs(d[2])>1e-6)for(let k=0;k<2;k++){const z=k===0?D/2:-D/2,t=(z-o[2])/d[2],a=o[0]+d[0]*t,b=o[1]+d[1]*t;if(t>0&&a*a+b*b<=1)hits.push({t,k,u:(a+1)/2,v:(1-b)/2,edge:a*a+b*b>.87})}const A=d[0]*d[0]+d[1]*d[1],B=2*(o[0]*d[0]+o[1]*d[1]),C=o[0]*o[0]+o[1]*o[1]-1,disc=B*B-4*A*C;if(A>1e-8&&disc>=0)for(const t of [(-B-Math.sqrt(disc))/(2*A),(-B+Math.sqrt(disc))/(2*A)]){const z=o[2]+t*d[2];if(t>0&&Math.abs(z)<=D/2){let angle=Math.atan2(o[1]+t*d[1],o[0]+t*d[0]);if(angle<0)angle+=2*Math.PI;hits.push({t,k:2,u:angle/(2*Math.PI),v:(D/2-z)/D,edge:false})}}hits.sort((a,b)=>a.t-b.t);return hits[0]}
function spray(x,y,strength=1){const dirty=new Set();for(let i=0;i<180*strength;i++){const angle=Math.random()*Math.PI*2,r=25*Math.sqrt(Math.random()),q=hit(x+Math.cos(angle)*r,y+Math.sin(angle)*r);if(!q)continue;const s=surfaces[q.k];s.p.fillStyle='#ff4d00';s.p.globalAlpha=Math.min(1,.5+(1-r/25)*.5);const size=q.k===2?2.5:1.2; s.p.fillRect(q.u*s.c.width,q.v*s.c.height,size,size);dirty.add(s)}for(const s of dirty){s.p.globalAlpha=1;s.dirty=true}render()}
function updateCursor(e){if(e.pointerType==='touch')return;const p=handle(),rotation=Math.hypot(e.clientX-p.x,e.clientY-p.y)<22;cursor.style.display=mode==='rotate'||mode==='move'||rotation?'none':'block';cursor.style.transform=`translate(${e.clientX-12}px,${e.clientY-2}px)`;canvas.style.cursor=rotation||mode==='rotate'?'grab':mode==='move'?'grabbing':'none'}
function pair(){const p=[...pointers.values()];return {x:(p[0].x+p[1].x)/2,y:(p[0].y+p[1].y)/2}}
canvas.oncontextmenu=e=>e.preventDefault();canvas.addEventListener('pointerdown',e=>{e.preventDefault();canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===2){gesture={...pair(),rx,ry};mode='gesture';point=null;return}if(pointers.size>2)return;active=e.pointerId;const p=handle(),q=hit(e.clientX,e.clientY);mode=e.shiftKey?'move':e.button===2||Math.hypot(e.clientX-p.x,e.clientY-p.y)<23||q?.edge?'rotate':'paint';drag={x:e.clientX,y:e.clientY,rx,ry,cx,cy};last=point={x:e.clientX,y:e.clientY};if(mode==='paint')spray(point.x,point.y,2);updateCursor(e)});
canvas.addEventListener('pointermove',e=>{if(pointers.has(e.pointerId))pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(mode==='gesture'&&pointers.size>=2){const p=pair();ry=gesture.ry+(p.x-gesture.x)*.012;rx=gesture.rx+(p.y-gesture.y)*.012;render();return}updateCursor(e);if(e.pointerId!==active)return;if(mode==='rotate'){ry=drag.ry+(e.clientX-drag.x)*.012;rx=drag.rx+(e.clientY-drag.y)*.012;render()}else if(mode==='move'){cx=drag.cx+e.clientX-drag.x;cy=drag.cy+e.clientY-drag.y;render()}else if(mode==='paint'){point={x:e.clientX,y:e.clientY};const dx=point.x-last.x,dy=point.y-last.y,n=Math.ceil(Math.hypot(dx,dy)/5);for(let i=1;i<=n;i++)spray(last.x+dx*i/n,last.y+dy*i/n,.8);last=point}});
function stop(e){pointers.delete(e.pointerId);if(mode==='gesture'||e.pointerId===active){mode=null;active=null;point=null}}for(const name of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(name,stop);canvas.addEventListener('pointerleave',()=>cursor.style.display='none');addEventListener('blur',()=>{pointers.clear();mode=null;active=null;point=null});canvas.addEventListener('wheel',e=>{e.preventDefault();ry+=e.deltaY*.004;render()},{passive:false});
function tick(t){if(mode==='paint'&&point&&t-tickTime>24){spray(point.x,point.y);tickTime=t}requestAnimationFrame(tick)}requestAnimationFrame(tick);
</script></body></html>
