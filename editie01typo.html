</g></svg></main><button id="start">Klik om het boorgeluid te starten</button><div id="controls" hidden><button id="sound" aria-pressed="true">Geluid uit</button><button id="pause" aria-pressed="false">Pauze</button></div><script>
const vehicles=[...document.querySelectorAll('.vehicle')].map((el,i)=>{const b=el.getBBox();return {el,x:b.x,y:b.y,h:b.height,speed:[108,-132,95][i],initial:[135,340,-25][i],voice:null}});
let ctx,master,muted=false,paused=false,time=0,previous=null;
function voice(i){
 const buffer=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate),data=buffer.getChannelData(0);let last=0;
 for(let j=0;j<data.length;j++){last=.35*last+.65*(Math.random()*2-1);data[j]=last}
 const noise=ctx.createBufferSource();noise.buffer=buffer;noise.loop=true;
 const filter=ctx.createBiquadFilter();filter.type='bandpass';filter.frequency.value=1700+i*210;filter.Q.value=.65;
 const motor=ctx.createOscillator();motor.type='sawtooth';motor.frequency.value=100+i*17;
 const motorGain=ctx.createGain();motorGain.gain.value=.16;
 const pulse=ctx.createOscillator();pulse.type='square';pulse.frequency.value=31+i*4;
 const pulseGain=ctx.createGain();pulseGain.gain.value=.19;
 const chop=ctx.createGain();chop.gain.value=.48;pulse.connect(pulseGain).connect(chop.gain);
 const gain=ctx.createGain();gain.gain.value=0;const pan=ctx.createStereoPanner();pan.pan.value=[-.65,.1,.65][i];
 noise.connect(filter).connect(chop);motor.connect(motorGain).connect(chop);chop.connect(gain).connect(pan).connect(master);
 noise.start();motor.start();pulse.start();return {gain,filter,motor};
}
const start=document.querySelector('#start'),sound=document.querySelector('#sound'),pause=document.querySelector('#pause');
start.onclick=async()=>{try{if(!ctx){ctx=new (window.AudioContext||window.webkitAudioContext)();master=ctx.createGain();master.gain.value=.26;const limiter=ctx.createDynamicsCompressor();limiter.threshold.value=-14;limiter.ratio.value=6;master.connect(limiter).connect(ctx.destination);vehicles.forEach((v,i)=>v.voice=voice(i))}await ctx.resume();start.hidden=true;document.querySelector('#controls').hidden=false;show()}catch(e){start.textContent='Geluid starten — klik opnieuw'}};
sound.onclick=()=>{muted=!muted;sound.textContent=muted?'Geluid aan':'Geluid uit';sound.setAttribute('aria-pressed',String(!muted));master.gain.setTargetAtTime(muted?0:.26,ctx.currentTime,.08)};
pause.onclick=()=>{paused=!paused;pause.textContent=paused?'Verder':'Pauze';pause.setAttribute('aria-pressed',String(paused))};
let hide;function show(){document.body.classList.add('controls-visible');clearTimeout(hide);hide=setTimeout(()=>document.body.classList.remove('controls-visible'),2200)}
document.addEventListener('pointermove',show);document.addEventListener('pointerdown',show);document.addEventListener('keydown',e=>{if(e.target.tagName==='BUTTON')return;if(e.code==='Space'){e.preventDefault();pause.click();show()}if(e.key==='m'&&ctx){sound.click();show()}});
document.addEventListener('visibilitychange',()=>{if(ctx)master.gain.setTargetAtTime(document.hidden||muted?0:.26,ctx.currentTime,.05)});
function frame(now){if(previous!==null&&!paused&&!document.hidden)time+=Math.min((now-previous)/1000,.06);previous=now;
 vehicles.forEach((v,i)=>{const span=595.276+v.h+150;const y=((v.initial+time*v.speed+v.h+75)%span+span)%span-v.h-75;
 const proximity=Math.max(0,1-Math.abs(y+v.h/2-297.638)/(297.638+v.h/2));
 const shake=paused?0:Math.sin(time*170+i)*.32*proximity;
 v.el.setAttribute('transform',`translate(${shake} ${y-v.y})`);
 if(v.voice){const t=ctx.currentTime;v.voice.gain.gain.setTargetAtTime(paused||document.hidden?0:Math.pow(proximity,2)*.7,t,.045);v.voice.filter.frequency.setTargetAtTime(850+proximity*1850,t,.06);v.voice.motor.frequency.setTargetAtTime(95+i*17+(297.638-y-v.h/2)*.055,t,.06)}
 });requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></body></html>
